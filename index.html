<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Hour 25</title>
    <meta name="description" content="Track where your time goes, half an hour at a time. Free, works offline, no tracking." />
    <meta property="og:title" content="Hour 25" />
    <meta property="og:description" content="Track where your time goes, half an hour at a time. Free, works offline, no tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hour25.app/" />
    <meta property="og:image" content="https://hour25.app/pwa-512x512.png" />
    <meta property="og:image:alt" content="The Hour 25 icon: a grid of half-hour slots, some filled." />
    <meta name="twitter:card" content="summary" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
